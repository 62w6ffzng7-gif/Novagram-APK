name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # ТЕПЕРЬ JAVA 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init NovaGram com.novagram.app --web-dir=www

      - name: Create WWW folder
        run: |
          mkdir www
          echo '<html><head><meta http-equiv="refresh" content="0; url=https://novagram-1.onrender.com" /></head><body>Loading...</body></html>' > www/index.html

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Files
        run: npx cap sync

      - name: Set Gradle 8.5
        run: |
          cd android
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.5-all.zip/' gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
